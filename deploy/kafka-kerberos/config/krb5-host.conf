[libdefaults]
    default_realm = STUDIO.TEST
    dns_lookup_kdc = false
    dns_lookup_realm = false
    rdns = false
    ticket_lifetime = 24h
    renew_lifetime = 7d
    forwardable = true
    udp_preference_limit = 1

[realms]
    STUDIO.TEST = {
        kdc = 127.0.0.1:10088
    }

[domain_realm]
    .kerberos.test = STUDIO.TEST
    kerberos.test = STUDIO.TEST

